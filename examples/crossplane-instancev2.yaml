apiVersion: compute.openstack.crossplane.io/v1alpha1
kind: InstanceV2
metadata:
  annotations:
    meta.upbound.io/example-id: compute/v1alpha1/instancev2
  name: crossplane-vm
spec:
    forProvider:
      name: crossplane-vm
      flavorId: <flavorID>
      imageId: <imageId>
      keyPair: <keyPairName>
      network:
      - name: <networkName>
      securityGroups: ["default", "anotherSecurityGroup"]
    providerConfigRef:
      name: provider-openstack-config # unless changed